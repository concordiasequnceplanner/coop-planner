<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MIAE Academic Planner - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">
    <div class="login-card">
        <h2>MIAE Planner Login</h2>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        {% if not ask_student_id %}
        <form method="POST" onsubmit="this.querySelector('button').disabled=true; this.querySelector('button').textContent='Sending…';">
            <input type="hidden" name="action" value="check_email">
            <input type="email" name="email" placeholder="student@concordia.ca" required autofocus>
            <button type="submit">Send Access Code</button>
        </form>
        
        {% else %}
        <div class="guest-section">
            <p><strong>Email not recognized.</strong> Please enter your Student ID to find your registered email:</p>
            <form method="POST" onsubmit="this.querySelector('button').disabled=true; this.querySelector('button').textContent='Searching…';">
                <input type="hidden" name="action" value="recover_email">
                <input type="text" name="student_id" placeholder="Student ID (8 digits)" required pattern="\d{8}">
                <button type="submit" class="btn-secondary">Find Email</button>
            </form>
            <div style="text-align: center; margin-top: 15px;">
                <a href="/login" class="back-link-inline">&larr; Back to Email Login</a>
            </div>
        </div>
        {% endif %}
    </div>

    {% if popup_message %}
    <script>
        alert("{{ popup_message }}");
        window.location.href = "/login";
    </script>
    {% endif %}
</body>
</html>
