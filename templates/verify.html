<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MIAE Academic Planner - Verify</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">
    <div class="login-card">
        {% if message %}
        <div class="info-message">{{ message }}</div>
        {% endif %}

        <h2>Enter Access Code</h2>
        <p>A 6-digit code has been sent to<br><strong>{{ email }}</strong></p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/verify">
            <input type="hidden" name="email" value="{{ email }}">
            <input type="text" class="otp-input" name="code" placeholder="------" required pattern="\d{6}" maxlength="6" autocomplete="off" autofocus>
            <button type="submit">Verify Code</button>
        </form>

        <div style="text-align: center; margin-top: 20px;">
            <a href="/login" class="back-link-inline">&larr; Back to Login / Use different email</a>
        </div>
    </div>
</body>
</html>
