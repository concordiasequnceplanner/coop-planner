<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAMS Paper Search — SRE Montreal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            color: #333;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #1a365d 0%, #2d5a87 100%);
            color: white;
            padding: 2rem;
            text-align: center;
        }
        .header h1 { font-size: 1.8rem; margin-bottom: 0.5rem; }
        .header p { opacity: 0.85; font-size: 0.95rem; }
        .container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .search-box {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            margin-bottom: 1.5rem;
        }
        .search-box label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 1.05rem;
        }
        .search-row {
            display: flex;
            gap: 0.75rem;
        }
        .search-row input {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        .search-row input:focus {
            outline: none;
            border-color: #2d5a87;
        }
        .search-row button {
            padding: 0.75rem 1.5rem;
            background: #2d5a87;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .search-row button:hover { background: #1a365d; }
        .search-row button:disabled {
            background: #a0aec0;
            cursor: not-allowed;
        }
</style>
</head>
<body>
    <div class="header">
        <h1>RAMS Conference Paper Search</h1>
        <p>Search through RAMS 2020–2025 conference papers by topic</p>
        <p style="font-size:0.8rem; margin-top:0.5rem; opacity:0.7;">
            Powered by AI analysis of paper summaries and conclusions
        </p>
    </div>

    <div class="container">
        <div class="search-box">
            <label for="searchInput">What research topic are you looking for?</label>
            <div class="search-row">
                <input type="text" id="searchInput"
                       placeholder='e.g. "predictive maintenance for aircraft engines"'
                       maxlength="500"
                       aria-label="Search query">
                <button id="searchBtn" onclick="doSearch()">Search</button>
            </div>
        </div>

        <div id="resultsArea"></div>
    </div>
</body>
</html>

<style>
        /* Results styles */
        .msg-blocked {
            background: #fed7d7;
            border-left: 4px solid #e53e3e;
            padding: 1rem 1.25rem;
            border-radius: 8px;
            color: #742a2a;
        }
        .msg-not-found {
            background: #fefcbf;
            border-left: 4px solid #d69e2e;
            padding: 1rem 1.25rem;
            border-radius: 8px;
        }
        .msg-not-found input[type="email"] {
            padding: 0.5rem 0.75rem;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            font-size: 0.95rem;
            width: 280px;
            margin-top: 0.75rem;
        }
        .msg-not-found button {
            padding: 0.5rem 1rem;
            background: #d69e2e;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-left: 0.5rem;
        }
        .results-header {
            background: #c6f6d5;
            border-left: 4px solid #38a169;
            padding: 1rem 1.25rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }
        .results-header strong { color: #22543d; }
        .paper-card {
            background: white;
            border-radius: 8px;
            padding: 1.25rem;
            margin-bottom: 0.75rem;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            border-left: 4px solid #2d5a87;
        }
        .paper-card .title {
            font-weight: 600;
            font-size: 1.05rem;
            margin-bottom: 0.4rem;
        }
        .paper-card .meta {
            font-size: 0.85rem;
            color: #718096;
            margin-bottom: 0.4rem;
        }
        .paper-card .explanation {
            font-size: 0.9rem;
            color: #4a5568;
            line-height: 1.5;
        }
        .relevance-badge {
            display: inline-block;
            background: #ebf8ff;
            color: #2b6cb0;
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .spinner {
            display: inline-block;
            width: 20px; height: 20px;
            border: 3px solid #e2e8f0;
            border-top-color: #2d5a87;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 0.5rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .email-sent {
            color: #38a169;
            font-weight: 600;
            margin-top: 0.5rem;
        }
</style>

<script>
const searchInput = document.getElementById('searchInput');
const searchBtn = document.getElementById('searchBtn');
const resultsArea = document.getElementById('resultsArea');

searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') doSearch();
});

async function doSearch() {
    const query = searchInput.value.trim();
    if (!query) return;

    searchBtn.disabled = true;
    resultsArea.innerHTML = '<p><span class="spinner"></span> Analyzing your query...</p>';

    try {
        const resp = await fetch('/SRE/api/search', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({query}),
        });
        const data = await resp.json();

        if (data.status === 'blocked') {
            resultsArea.innerHTML = `<div class="msg-blocked">${data.message}</div>`;
        } else if (data.status === 'not_found') {
            resultsArea.innerHTML = `
                <div class="msg-not-found">
                    <p>${data.message}</p>
                    <div>
                        <input type="email" id="emailInput" placeholder="your@email.com">
                        <button onclick="submitEmail()">Submit</button>
                    </div>
                    <div id="emailStatus"></div>
                </div>`;
        } else if (data.status === 'found') {
            let html = `
                <div class="results-header">
                    <strong>Matched topic:</strong> ${data.matched_query}
                    (confidence: ${Math.round(data.confidence * 100)}%)<br>
                    <strong>${data.total_results}</strong> paper(s) found
                </div>`;

            if (data.results && data.results.length > 0) {
                for (const r of data.results) {
                    html += `
                        <div class="paper-card">
                            <div class="title">${r.title || r.filename}</div>
                            <div class="meta">
                                Year: ${r.year}
                                &nbsp;|&nbsp;
                                <span class="relevance-badge">${r.relevance_pct}% relevant</span>
                            </div>
                            <div class="explanation">${r.explanation || ''}</div>
                        </div>`;
                }
            } else {
                html += '<p>No papers matched this topic with high confidence.</p>';
            }
            resultsArea.innerHTML = html;
        } else if (data.error) {
            resultsArea.innerHTML = `<div class="msg-blocked">${data.error}</div>`;
        }
    } catch (err) {
        resultsArea.innerHTML = `<div class="msg-blocked">Connection error. Please try again.</div>`;
    }
    searchBtn.disabled = false;
}

function submitEmail() {
    const email = document.getElementById('emailInput').value.trim();
    if (!email || !email.includes('@')) {
        document.getElementById('emailStatus').innerHTML =
            '<p style="color:#e53e3e;">Please enter a valid email.</p>';
        return;
    }
    document.getElementById('emailStatus').innerHTML =
        '<p class="email-sent">Thank you! We\'ll send results to ' + email + ' when ready.</p>';
}
</script>
