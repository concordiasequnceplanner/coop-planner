<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R.A.M.S. Paper Search — SRE Montreal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; color: #333; min-height: 100vh; }
        .header { background: linear-gradient(135deg, #1a365d 0%, #2d5a87 100%); color: white; padding: 2rem; text-align: center; }
        .header h1 { font-size: 1.8rem; margin-bottom: 0.5rem; }
        .header p { opacity: 0.85; font-size: 0.95rem; }
        .container { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
        .search-box { background: white; border-radius: 12px; padding: 2rem; box-shadow: 0 2px 12px rgba(0,0,0,0.08); margin-bottom: 1.5rem; }
        .search-box label { display: block; font-weight: 600; margin-bottom: 0.5rem; font-size: 1.05rem; }
        .search-row { display: flex; gap: 0.75rem; }
        .search-row input { flex: 1; padding: 0.75rem 1rem; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 1rem; }
        .search-row input:focus { outline: none; border-color: #2d5a87; }
        .search-row button { padding: 0.75rem 1.5rem; background: #2d5a87; color: white; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; white-space: nowrap; }
        .search-row button:hover { background: #1a365d; }
        .search-row button:disabled { background: #a0aec0; cursor: not-allowed; }
        .msg-blocked { background: #fed7d7; border-left: 4px solid #e53e3e; padding: 1rem 1.25rem; border-radius: 8px; color: #742a2a; }
        .msg-not-found { background: #fefcbf; border-left: 4px solid #d69e2e; padding: 1rem 1.25rem; border-radius: 8px; }
        .msg-not-found input[type="email"] { padding: 0.5rem 0.75rem; border: 2px solid #e2e8f0; border-radius: 6px; font-size: 0.95rem; width: 280px; margin-top: 0.75rem; }
        .msg-not-found button { padding: 0.5rem 1rem; background: #d69e2e; color: white; border: none; border-radius: 6px; cursor: pointer; margin-left: 0.5rem; }
        .results-header { padding: 1rem 1.25rem; border-radius: 8px; margin-bottom: 1rem; }
        .paper-card { border-radius: 8px; padding: 1.25rem; margin-bottom: 0.75rem; box-shadow: 0 1px 4px rgba(0,0,0,0.06); border-left: 4px solid #2d5a87; }
        .paper-card .title { font-weight: 600; font-size: 1.05rem; margin-bottom: 0.4rem; cursor: pointer; color: #2d5a87; }
        .paper-card .title:hover { color: #1a365d; text-decoration: underline; }
        .paper-card .title::before { content: '▶ '; font-size: 0.7rem; }
        .paper-card .title.expanded::before { content: '▼ '; }
        .paper-card .meta { font-size: 0.85rem; color: #718096; margin-bottom: 0.3rem; }
        .paper-card .authors { font-size: 0.85rem; color: #555; margin-bottom: 0.4rem; font-style: italic; }
        .paper-card .explanation { font-size: 0.88rem; color: #4a5568; line-height: 1.5; margin-top: 0.5rem; padding: 0.6rem 0.75rem; background: #f0f4f8; border-radius: 6px; border-left: 3px solid #2d5a87; }
        .paper-card .summary { display: none; font-size: 0.9rem; color: #4a5568; line-height: 1.6; margin-top: 0.75rem; padding: 0.75rem; background: #f7fafc; border-radius: 6px; border: 1px solid #e2e8f0; text-align: justify; }
        .paper-card .summary.visible { display: block; }
        .relevance-badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 4px; font-size: 0.8rem; font-weight: 600; }
        .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid #e2e8f0; border-top-color: #2d5a87; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 0.5rem; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .email-sent { color: #38a169; font-weight: 600; margin-top: 0.5rem; }
        .top-bar { display: flex; align-items: center; justify-content: space-between; padding: 0.6rem 1.5rem; background: white; border-bottom: 1px solid #e2e8f0; }
        .top-bar .sre-brand { display: flex; align-items: center; gap: 0.6rem; text-decoration: none; color: #1a5e2a; font-size: 0.85rem; font-weight: 600; }
        .top-bar .sre-brand img { width: 36px; height: 36px; border-radius: 50%; }
        .top-bar .home-btn { padding: 0.4rem 1rem; background: #1a5e2a; color: white; border: none; border-radius: 6px; font-size: 0.85rem; text-decoration: none; cursor: pointer; }
        .top-bar .home-btn:hover { background: #145220; }
    </style>
</head>
<body>
    <div class="top-bar">
        <span class="sre-brand"><img src="/static/images/sre_logo.png" alt="SRE">Search supported by SRE Montreal Chapter 6</span>
        <a class="home-btn" href="http://sremontreal.org/">🏠 HOME</a>
    </div>
    <div class="header">
        <h1>R.A.M.S. Symposium Paper Search</h1>
        <p>Search through R.A.M.S. 2020–2025 symposium papers by topic</p>
        <p style="font-size:0.8rem; margin-top:0.5rem; opacity:0.7;">Powered by AI analysis of paper summaries and conclusions</p>
    </div>
    <div class="container">
        <div class="search-box">
            <label for="searchInput">What research topic are you looking for?</label>
            <div class="search-row">
                <input type="text" id="searchInput" placeholder='e.g. "predictive maintenance for aircraft engines"' maxlength="500" aria-label="Search query">
                <button id="searchBtn" onclick="doSearch()">Search</button>
            </div>
        </div>
        <div id="resultsArea"></div>
    </div>
    <script>
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const resultsArea = document.getElementById('resultsArea');
    searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

    function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

    function confidenceColor(pct) {
        if (pct <= 80) {
            const t = Math.max(0, (pct - 30)) / 50;
            return `rgb(${180+Math.round(t*40)},${30+Math.round(t*60)},${20+Math.round(t*20)})`;
        }
        const t = (pct - 80) / 20;
        return `rgb(${Math.round(220-t*185)},${Math.round(90+t*70)},${Math.round(40-t*10)})`;
    }

    async function doSearch() {
        const query = searchInput.value.trim();
        if (!query) return;
        searchBtn.disabled = true;
        resultsArea.innerHTML = '<p><span class="spinner"></span> Analyzing your query...</p>';
        try {
            const resp = await fetch('/SRE/api/search', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({query}),
            });
            const data = await resp.json();
            if (data.status === 'blocked') {
                resultsArea.innerHTML = `<div class="msg-blocked">${esc(data.message)}</div>`;
            } else if (data.status === 'not_found') {
                resultsArea.innerHTML = `<div class="msg-not-found"><p>${esc(data.message)}</p>
                    <div style="margin-top:0.75rem;">
                    <input type="text" id="nameInput" placeholder="Your name" style="padding:0.5rem 0.75rem;border:2px solid #e2e8f0;border-radius:6px;font-size:0.95rem;width:280px;margin-bottom:0.5rem;display:block;">
                    <input type="email" id="emailInput" placeholder="your@email.com" style="padding:0.5rem 0.75rem;border:2px solid #e2e8f0;border-radius:6px;font-size:0.95rem;width:280px;">
                    <button onclick="submitEmail()">Submit</button></div>
                    <div id="emailStatus"></div></div>`;
            } else if (data.status === 'found') {
                const confPct = Math.round(data.confidence * 100);
                const confColor = confidenceColor(confPct);
                const lowConf = confPct < 80;
                const headerBg = lowConf ? 'background:#fff3e0;border-left:4px solid #e65100;' : 'background:#c6f6d5;border-left:4px solid #38a169;';
                const headerTxt = lowConf ? 'color:#bf360c;' : 'color:#22543d;';
                let html = `<div class="results-header" style="${headerBg}">
                    <strong style="${headerTxt}">Matched topic:</strong>
                    <span style="color:${confColor};font-weight:700;">${esc(data.matched_query)} (${confPct}%)</span><br>
                    <strong style="${headerTxt}">${data.total_results}</strong> <span style="${headerTxt}">paper(s) found</span></div>`;
                if (data.results && data.results.length > 0) {
                    data.results.forEach((r, i) => {
                        const rel = parseInt(r.relevance_pct) || 0;
                        const cardBg = rel < 80 ? 'background:#fff5f5;' : 'background:white;';
                        const borderColor = rel < 80 ? 'border-left-color:#e53e3e;' : '';
                        const authors = r.authors || '';
                        const explanation = r.explanation || '';
                        const summary = r.summary || 'No summary available.';
                        const relColor = confidenceColor(rel);
                        html += `<div class="paper-card" style="${cardBg}${borderColor}">
                            <div class="title" onclick="toggleSummary(${i})" id="title_${i}">${esc(r.title || r.filename)}</div>
                            <div class="meta">Year: ${esc(String(r.year))}${authors ? ' &nbsp;|&nbsp; ' + esc(authors) : ''}</div>
                            ${explanation ? '<div class="explanation"><strong>GPT answer (<span class="relevance-badge" style="background:' + relColor + '22;color:' + relColor + ';">' + rel + '% relevant</span>):</strong> ' + esc(explanation) + '</div>' : ''}
                            <div class="summary" id="summary_${i}"><strong>Authors' summary:</strong><br>${esc(summary)}</div>
                        </div>`;
                    });
                } else { html += '<p>No papers matched this topic with high confidence.</p>'; }
                resultsArea.innerHTML = html;
            } else if (data.error) {
                resultsArea.innerHTML = `<div class="msg-blocked">${esc(data.error)}</div>`;
            }
        } catch (err) {
            resultsArea.innerHTML = '<div class="msg-blocked">Connection error. Please try again.</div>';
        }
        searchBtn.disabled = false;
    }
    function toggleSummary(i) {
        const sum = document.getElementById('summary_'+i);
        const ttl = document.getElementById('title_'+i);
        const isOpen = sum?.classList.contains('visible');
        // Close all
        document.querySelectorAll('.paper-card .summary.visible').forEach(el => el.classList.remove('visible'));
        document.querySelectorAll('.paper-card .title.expanded').forEach(el => el.classList.remove('expanded'));
        // If it wasn't open, open it
        if (!isOpen) {
            sum?.classList.add('visible');
            ttl?.classList.add('expanded');
        }
    }
    async function submitEmail() {
        const name = document.getElementById('nameInput')?.value.trim();
        const email = document.getElementById('emailInput')?.value.trim();
        if (!name) { document.getElementById('emailStatus').innerHTML='<p style="color:#e53e3e;">Please enter your name.</p>'; return; }
        if (!email || !email.includes('@')) { document.getElementById('emailStatus').innerHTML='<p style="color:#e53e3e;">Please enter a valid email.</p>'; return; }
        try {
            const resp = await fetch('/SRE/api/notify_search', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name: name, email: email, query: searchInput.value.trim()}),
            });
            if (resp.ok) {
                document.getElementById('emailStatus').innerHTML='<p class="email-sent">Thank you! We\'ll look into your query and get back to you.</p>';
            } else {
                document.getElementById('emailStatus').innerHTML='<p class="email-sent">Thank you! We\'ll look into it.</p>';
            }
        } catch(e) {
            document.getElementById('emailStatus').innerHTML='<p class="email-sent">Thank you! We\'ll look into it.</p>';
        }
    }
    </script>
</body>
</html>
