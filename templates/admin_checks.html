<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Checks - MIAE Planner</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=V03_025">
</head>
<body>
    <div class="spinner-overlay" id="loadingOverlay">
        <div class="spinner-loader"></div>
        <h3 style="color: #2c3e50;" id="loadingText">⏳ Running query across database... Please wait.</h3>
    </div>

    <h2 class="admin-heading">📋 Admin Automated Checks</h2>

    <div class="admin-checks-panel">
        {% for chk in checks %}
        <label class="admin-check-label" {% if chk.disabled %}style="opacity:0.5; cursor:not-allowed;"{% endif %}>
            <input type="radio" name="checkOption" value="{{ chk.id }}"
                   data-msg="{{ chk.msg }}" data-short="{{ chk.short }}" data-what="{{ chk.what }}"
                   onchange="loadCheckData()" {% if chk.disabled %}disabled{% endif %}>
            <strong>{{ chk.id }}.</strong> {{ chk.what }}
        </label>
        {% endfor %}
    </div>

    <h3 id="studentCountDisplay" class="student-count"></h3>

    <!-- Check 7: Students Needing WT Attention -->
    <div id="check7Panel" style="display:none; margin:15px 0;">
        <button onclick="runCheck7()" style="background:#e67e22; color:#fff; border:none; padding:8px 18px; border-radius:6px; font-weight:bold; cursor:pointer; margin-bottom:10px;">🔍 Find Students Needing Attention</button>
        <div id="check7Results" style="display:none;"></div>
    </div>

    <!-- Check 8: Date filters + WT Movement panel -->
    <div id="check8Panel" style="display:none; margin:15px 0;">
        <div style="display:flex; gap:15px; align-items:center; background:#f0f4ff; padding:12px 18px; border-radius:8px; border:1px solid #b0c4de; margin-bottom:15px;">
            <label style="font-weight:bold; color:#2c3e50;">📅 From:</label>
            <input type="date" id="check8DateFrom" style="padding:5px 10px; border:1px solid #aaa; border-radius:4px;">
            <label style="font-weight:bold; color:#2c3e50;">To:</label>
            <input type="date" id="check8DateTo" style="padding:5px 10px; border:1px solid #aaa; border-radius:4px;">
            <button onclick="runCheck8()" style="background:#2980b9; color:#fff; border:none; padding:8px 18px; border-radius:6px; font-weight:bold; cursor:pointer;">🔍 Analyze WT Movements</button>
        </div>
        <div id="check8Summary" style="display:none; font-weight:bold; color:#2c3e50; margin-bottom:10px;"></div>
        <div id="check8Results" style="display:none;"></div>
    </div>

    <div class="admin-results-wrap">
        <table id="resultsTable" class="admin-results-table" style="display: none;">
            <thead>
                <tr>
                    <th class="admin-col-select"><input type="checkbox" id="checkAll" checked onclick="toggleAll(this)"></th>
                    <th class="admin-col-name admin-sortable" data-sort-type="text">Name</th>
                    <th class="admin-col-program admin-sortable" data-sort-type="text">Program</th>
                    <th class="admin-col-coop-program admin-sortable" data-sort-type="text" id="coopProgramHeader" style="display:none;">Co-op Program</th>
                    <th class="admin-col-current-courses admin-sortable" data-sort-type="text" id="currentCoursesHeader" style="display:none;">Current Term Courses</th>
                    <th class="admin-col-email admin-sortable" data-sort-type="text">Email</th>
                    <th class="admin-col-sid admin-sortable" data-sort-type="numeric">Student ID</th>
                    <th class="admin-col-gpa admin-sortable" data-sort-type="numeric">Last CGPA</th>
                    <th class="admin-col-credits admin-sortable" data-sort-type="numeric">CGPA Credits</th>
                    <th class="admin-col-gpa admin-sortable" data-sort-type="numeric">Last GPA24</th>
                    <th class="admin-col-credits admin-sortable" data-sort-type="numeric">GPA24 Credits</th>
                    <th class="admin-col-wts admin-sortable" data-sort-type="text">Scheduled WTs</th>
                    <th class="admin-col-deviations admin-sortable" data-sort-type="text" id="deviatedCoursesHeader" style="display:none;">Transcript vs Approved</th>
                    <th class="admin-col-notes admin-sortable" data-sort-type="text">Notes (Visible)</th>
                    <th class="admin-col-notes admin-sortable" data-sort-type="text">Notes (Invisible)</th>
                </tr>
            </thead>
            <tbody id="studentsTableBody"></tbody>
        </table>
    </div>

    <div class="admin-email-panel">
        <div style="display: flex; gap: 20px; margin-bottom: 15px;">
            <div class="admin-input-group">
                <label>🏷️ Email Title (Subject):</label><br>
                <input type="text" id="emailTitle" style="font-weight: bold; color: #912338;">
            </div>
            <div class="admin-input-group">
                <label>💾 Short Message (Database Note):</label><br>
                <input type="text" id="shortMessage">
            </div>
        </div>

        <div class="admin-input-group" style="margin-bottom: 20px;">
            <label>✉️ Message (Email Body):</label><br>
            <textarea id="emailMessage"></textarea>
        </div>

        <div class="admin-wt-warning">
            <label style="margin-right: 20px;">
                <input type="checkbox" id="chkInstAdmin" style="accent-color: #c0392b; width: 16px; height: 16px; vertical-align: middle;">
                WT restriction → cc. Institute Operations
            </label>
            <label>
                <input type="checkbox" id="chkCoopReseq" style="accent-color: #2980b9; width: 16px; height: 16px; vertical-align: middle;">
                WT restriction → cc. Coop Resequence
            </label>
        </div>

        <button class="admin-send-btn" onclick="sendBulkEmails()">📤 SEND EMAILS TO SELECTED</button>
    </div>

    <script src="{{ url_for('static', filename='js/admin_checks.js') }}?v=V03_025"></script>
</body>
</html>
